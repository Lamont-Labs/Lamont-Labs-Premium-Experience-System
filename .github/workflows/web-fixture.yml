name: Web component fixture

on:
  push:
    paths:
      - "components/web/**"
      - "fixtures/web/**"
      - ".github/workflows/web-fixture.yml"
  pull_request:
    paths:
      - "components/web/**"
      - "fixtures/web/**"
      - ".github/workflows/web-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fixtures/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-fixture-evidence
          path: |
            fixtures/web/test-results/
            fixtures/web/playwright-report/
          if-no-files-found: ignore
      - name: Report failed build to GitHub Issues
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CI failure: Web component fixture";
            const body = [
              "Web fixture failed. Inspect the linked workflow run and job logs.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "Commit: " + context.sha,
              "Event: " + context.eventName
            ].join("\n");
            const { owner, repo } = context.repo;
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Close resolved CI failure issue
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CI failure: Web component fixture";
            const { owner, repo } = context.repo;
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "Verification passed. Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId + "\nCommit: " + context.sha
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
            }
