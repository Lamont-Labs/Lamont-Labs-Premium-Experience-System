name: Android Compose fixture

on:
  push:
    paths:
      - "components/android/**"
      - "fixtures/android/**"
      - ".github/workflows/android-fixture.yml"
  pull_request:
    paths:
      - "components/android/**"
      - "fixtures/android/**"
      - ".github/workflows/android-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Compose fixture
        working-directory: fixtures/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ll-pes-android-fixture-debug
          path: fixtures/android/app/build/outputs/apk/debug/*.apk
