name: Android Compose fixture

on:
  push:
    paths:
      - "components/android/**"
      - "fixtures/android/**"
      - ".github/workflows/android-fixture.yml"
  pull_request:
    paths:
      - "components/android/**"
      - "fixtures/android/**"
      - ".github/workflows/android-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android 35 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile all shared Compose components in fixture
        working-directory: fixtures/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ll-pes-android-fixture-debug
          path: fixtures/android/app/build/outputs/apk/debug/*.apk
      - name: Report failed build to GitHub Issues
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CI failure: Android Compose fixture";
            const body = [
              "Android fixture failed. Review the linked workflow logs for the precise failed step.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "Commit: " + context.sha,
              "Event: " + context.eventName,
              "",
              "No logs or secrets are copied into this issue. The GitHub-connected assistant can inspect the run link and repository issue metadata."
            ].join("\n");
            const { owner, repo } = context.repo;
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Close resolved CI failure issue
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CI failure: Android Compose fixture";
            const { owner, repo } = context.repo;
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "Verification passed. Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId + "\nCommit: " + context.sha
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
            }

      - name: Publish Android verification receipt
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "CI proof: Android Compose fixture";
            const receipt = [
              "Latest successful Android fixture build.",
              "",
              "Run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
              "Commit: " + context.sha,
              "Job: Android Compose fixture compilation and artifact upload",
              "Note: build proof only; no device-level verification"
            ].join("\n");
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body: receipt });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: receipt });
            }
